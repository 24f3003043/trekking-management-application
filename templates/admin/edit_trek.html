{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Trek</h2>
    <a href="/admin/treks" class="btn btn-outline-secondary">Back to Treks</a>
</div>

<div class="card shadow-sm col-md-8 offset-md-2">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-select">
                        <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Medium" {% if trek.difficulty == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Duration (Days)</label>
                    <input type="number" name="duration" class="form-control" min="1" value="{{ trek.duration }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Available Slots</label>
                    <input type="number" name="available_slots" class="form-control" min="0" value="{{ trek.available_slots }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ trek.start_date.strftime('%Y-%m-%d') if trek.start_date else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ trek.end_date.strftime('%Y-%m-%d') if trek.end_date else '' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Assign Trek Staff (Guide)</label>
                <select name="staff_id" class="form-select">
                    <option value="">-- No Guide Assigned --</option>
                    {% for member in staff %}
                    <option value="{{ member.id }}" {% if trek.staff_id == member.id %}selected{% endif %}>{{ member.name }} ({{ member.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4">{{ trek.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                    <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                    <option value="Started" {% if trek.status == 'Started' %}selected{% endif %}>Started</option>
                    <option value="Ongoing" {% if trek.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                    <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Update Trek</button>
        </form>
    </div>
</div>
{% endblock %}
