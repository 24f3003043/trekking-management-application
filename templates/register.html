{% extends "base.html" %}

{% block content %}

<h2>Register</h2>

<form method="POST">

    <div class="mb-3">

        <label>Name</label>

        <input
            type="text"
            name="name"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label>Phone</label>

        <input
            type="tel"
            name="phone"
            class="form-control"
            minlength="10"
            maxlength="10"
            required>

    </div>

    <div class="mb-3">

        <label>Password</label>

        <input
            type="password"
            name="password"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label>Register As</label>

        <select
            name="role"
            class="form-select">

            <option value="user">Trekker</option>

            <option value="staff">Trek Staff</option>

        </select>

    </div>

    <button class="btn btn-success">

        Register

    </button>

</form>

{% endblock %}
