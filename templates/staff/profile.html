{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Update Staff Profile</h2>
    <a href="/staff/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
</div>
<div class="card shadow-sm col-md-8 offset-md-2">
    <div class="card-body">
        {% if msg %}
        <div class="alert alert-success">{{ msg }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email Address (Cannot be changed)</label>
                <input type="email" class="form-control" value="{{ user.email }}" readonly disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Experience (Years)</label>
                    <input type="number" name="experience_years" class="form-control" min="0" value="{{ user.experience_years or 0 }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Key Skills</label>
                    <input type="text" name="skills" class="form-control" placeholder="e.g. First Aid, Navigation, High Altitude" value="{{ user.skills or '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Professional Bio</label>
                <textarea name="bio" class="form-control" rows="4" placeholder="Tell us about your trekking experience...">{{ user.bio or '' }}</textarea>
            </div>
            <div class="mb-4">
                <label class="form-label">New Password (Leave blank to keep current password)</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
